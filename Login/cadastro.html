<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- UNIEVENTS — CADASTRO DE USUÁRIOS -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniEvents | Crie sua conta</title>

    <link rel="stylesheet" href="style.css">

    <!-- UNIEVENTS — SISTEMA GLOBAL DE TEMAS -->
    <script src="../Assets/tema.js"></script>
    <link rel="stylesheet" href="../Assets/tema.css">
</head>

<body>
    <main class="login-page">

        <!-- Fundo visual -->
        <div class="background-overlay"></div>

        <!-- Identidade visual -->
        <header class="brand">

            <div class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" />

                    <path d="M7 3V7M17 3V7M3 10H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />

                    <path d="M8 14H10M14 14H16M8 17H10" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" />
                </svg>
            </div>

            <span>
                Uni<span class="brand-highlight">Events</span>
            </span>

        </header>

        <!-- Formulário de cadastro -->
        <section class="login-card">

            <div class="card-heading">
                <span class="welcome-label">UNIEVENTS</span>

                <h1>Crie sua conta</h1>

                <p>
                    Cadastre-se para acompanhar eventos acadêmicos.
                </p>
            </div>

            <form id="cadastroForm" novalidate>

                <!-- Nome completo -->
                <div class="form-group">

                    <label for="nome">Nome completo</label>

                    <div class="input-wrapper">
                        <input id="nome" name="nome" type="text" autocomplete="name" minlength="3" maxlength="100"
                            placeholder="Seu nome completo" required>
                    </div>

                </div>

                <!-- E-mail -->
                <div class="form-group">

                    <label for="email">E-mail</label>

                    <div class="input-wrapper">
                        <input id="email" name="email" type="email" autocomplete="email"
                            placeholder="seuemail@exemplo.com" required>
                    </div>

                </div>

                <!-- Senha -->
                <div class="form-group">

                    <label for="password">Senha</label>

                    <div class="input-wrapper">

                        <input id="password" name="password" type="password" autocomplete="new-password"
                            placeholder="Crie uma senha" required>

                        <!-- Mostrar / ocultar senha -->
                        <button type="button" id="toggle-password" class="toggle-password" aria-label="Mostrar senha"
                            aria-pressed="false" aria-controls="password" title="Mostrar senha">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>

                    </div>

                </div>

                <!-- Confirmar senha -->
                <div class="form-group">

                    <label for="confirm-password">
                        Confirmar senha
                    </label>

                    <div class="input-wrapper">

                        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password"
                            placeholder="Repita sua senha" required>

                        <!-- Mostrar / ocultar confirmação -->
                        <button type="button" id="toggle-confirm-password" class="toggle-password"
                            aria-label="Mostrar confirmação de senha" aria-pressed="false"
                            aria-controls="confirm-password" title="Mostrar confirmação de senha">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>

                    </div>

                </div>

                <!-- Botão de cadastro -->
                <button type="submit" class="login-button">
                    Criar conta
                </button>

                <!-- Mensagens de erro e sucesso -->
                <p id="login-message" role="status" aria-live="polite"></p>

                <p class="password-hint">
                    A senha deve ter pelo menos 8 caracteres,
                    incluindo letra maiúscula, minúscula,
                    número e símbolo.
                </p>

            </form>

            <!-- Voltar ao login -->
            <p class="signup-text">
                <a href="index.html">Voltar ao login</a>
            </p>

        </section>

        <footer class="page-footer">
            © 2026 UniEvents · CONECTANDO PESSOAS AO CONHECIMENTO
        </footer>

    </main>

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <!-- Configuração existente -->
    <script src="config.js"></script>

    <!-- Autenticação -->
    <script src="script.js"></script>

</body>

</html>
